name: Refresh Trials featured maps

on:
  schedule:
    # Friday Trials start (17:00 UTC) — several retries; Bungie often lags.
    - cron: "5 17 * * 5"
    - cron: "20 17 * * 5"
    - cron: "35 17 * * 5"
    - cron: "5 18 * * 5"
    - cron: "5 19 * * 5"
    - cron: "5 21 * * 5"
    # Saturday morning catch-up when Friday jobs missed maps.
    - cron: "15 8 * * 6"
    - cron: "15 14 * * 6"
    # Monday safety net during the Trials weekend window.
    - cron: "15 17 * * 1"
  workflow_dispatch:

concurrency:
  group: refresh-trials-featured-maps
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check Bungie API key secret
        run: |
          if [ -z "${{ secrets.BUNGIE_API_KEY }}" ]; then
            echo "::error::Missing repository secret BUNGIE_API_KEY. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Regenerate Trials featured maps
        env:
          BUNGIE_API_KEY: ${{ secrets.BUNGIE_API_KEY }}
        run: npm run generate:trials-featured-maps

      - name: Verify Trials featured maps snapshot week
        run: |
          node --input-type=module -e "
          import { readFileSync } from 'node:fs';
          const TRIALS_EPOCH_MS = Date.UTC(2026, 5, 12, 17, 0, 0);
          const MS_PER_WEEK = 7 * 24 * 60 * 60 * 1000;
          const nowMs = Date.now();
          let weekIndex = Math.floor((nowMs - TRIALS_EPOCH_MS) / MS_PER_WEEK);
          let startMs = TRIALS_EPOCH_MS + weekIndex * MS_PER_WEEK;
          if (nowMs < startMs) {
            weekIndex -= 1;
          }
          const data = JSON.parse(readFileSync('data/trials-featured-maps.json', 'utf8'));
          if (data.weekIndex !== weekIndex) {
            throw new Error(\`trials-featured-maps.json weekIndex \${data.weekIndex} != current \${weekIndex}\`);
          }
          console.log(
            'Verified week',
            data.weekIndex + 1,
            'maps',
            data.maps?.length ? data.maps : '(none — Trials inactive or not published)',
          );
          "

      - name: Commit and push if changed
        run: |
          if [ ! -f data/trials-featured-maps.json ]; then
            echo "No Trials featured maps snapshot on disk."
            exit 1
          fi

          git add data/trials-featured-maps.json

          if git diff --cached --quiet; then
            echo "No changes in Trials featured maps"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): refresh Trials of Osiris featured maps" -m "Scheduled sync of data/trials-featured-maps.json."
          git push
