name: Refresh featured activities

on:
  schedule:
    # Tuesday after weekly reset (17:00 UTC) — several retries because Bungie
    # milestones and weekly reset posts often lag the reset by minutes/hours.
    - cron: "5 17 * * 2"
    - cron: "20 17 * * 2"
    - cron: "35 17 * * 2"
    - cron: "5 18 * * 2"
    - cron: "5 19 * * 2"
    - cron: "5 21 * * 2"
    # Wednesday morning catch-up when Kyber/Blueberries still lag Tuesday night.
    - cron: "15 8 * * 3"
    - cron: "15 14 * * 3"
    # Daily safety net if Tuesday jobs were skipped (inactive repo / Actions lag).
    - cron: "15 17 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-featured-activities
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check Bungie API key secret
        run: |
          if [ -z "${{ secrets.BUNGIE_API_KEY }}" ]; then
            echo "::error::Missing repository secret BUNGIE_API_KEY. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Regenerate featured activities
        env:
          BUNGIE_API_KEY: ${{ secrets.BUNGIE_API_KEY }}
        run: npm run generate:featured-activities

      - name: Verify featured activities snapshot
        run: |
          node --input-type=module -e "
          import { readFileSync } from 'node:fs';
          import { rotationWeekIndex } from './scripts/featured-rotation-shared.mjs';
          const data = JSON.parse(readFileSync('data/featured-activities.json', 'utf8'));
          const currentWeek = rotationWeekIndex(new Date());
          if (data.weekIndex !== currentWeek) {
            throw new Error(\`featured-activities.json weekIndex \${data.weekIndex} != current \${currentWeek}\`);
          }
          if (!data.featuredRaids?.length || !data.featuredDungeons?.length) {
            throw new Error('featured-activities.json is missing raids or dungeons');
          }
          console.log('Verified week', data.weekIndex + 1, 'raids', data.featuredRaids, 'dungeons', data.featuredDungeons);
          "

      - name: Commit and push if changed
        run: |
          git add data/featured-activities.json data/featured-rotation-schedule.json

          if git diff --cached --quiet; then
            echo "No changes in featured activities"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): refresh featured raid and dungeon rotation" -m "Scheduled sync of featured-activities.json (Bungie raids + Kyber/Blueberries dungeons)."
          git push
